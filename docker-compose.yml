version: '3.8'

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appdb
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/appdb
      VECTOR_STORE: pgvector
      CHROMA_PERSIST_DIR: ./chroma_db
      OPENAI_API_KEY: ""
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  streamlit:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./:/app
    depends_on:
      - app
    command: bash -c "pip install --no-cache-dir -r requirements.txt && streamlit run streamlit_app.py --server.port 8501 --server.address 0.0.0.0"
    ports:
      - "8501:8501"

volumes:
  db_data:
